<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Split Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="mark" src="icons/mark-64.png" alt="" width="32" height="32">
    <div><h1>AI Split Bridge</h1><p id="capability">Checking Chrome’s Split View support…</p></div>
  </header>

  <section id="pair-section" hidden>
    <h2>Split View</h2>
    <form id="pair-form" class="card">
      <div class="row"><label for="left">Left</label><select id="left" required></select></div>
      <div class="row"><label for="right">Right</label><select id="right" required></select></div>
      <div class="row end"><button id="pair" class="primary" type="submit">Create split</button></div>
    </form>
  </section>

  <section>
    <h2>Open an assistant</h2>
    <div class="providers">
      <button type="button" class="chip" data-provider="chatgpt">ChatGPT</button>
      <button type="button" class="chip" data-provider="claude">Claude</button>
      <button type="button" class="chip" data-provider="gemini">Gemini</button>
      <button type="button" class="chip" data-provider="grok">Grok</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <section>
    <h2>Reading</h2>
    <div class="card">
      <div class="row">
        <label for="readingWide" class="grow"><span class="title">Wider messages</span><span class="detail">Use more of each chat pane for reading.</span></label>
        <input id="readingWide" type="checkbox" role="switch" class="switch" disabled>
      </div>
      <div class="row">
        <label for="readingTools" class="grow"><span class="title">Message tools</span><span class="detail">Collapse or bookmark individual prompts and replies.</span></label>
        <input id="readingTools" type="checkbox" role="switch" class="switch" disabled>
      </div>
      <div id="reading-index" class="field" hidden>
        <span class="title">Bookmarks in this chat</span>
        <div id="reading-items"></div>
        <p class="detail" id="reading-detail" role="status"></p>
      </div>
    </div>
    <p class="detail" id="reading-error" role="status"></p>
  </section>

  <section>
    <h2>Sharing</h2>
    <form id="share-settings" class="card">
      <div class="row">
        <label for="send-now" class="grow"><span class="title">Send right away</span><span id="mode-detail" class="detail">Send shared messages, comparisons and cross-reviews immediately.</span></label>
        <input id="send-now" type="checkbox" role="switch" class="switch" disabled>
      </div>
      <div class="row template-choice">
        <label for="share-kind">Message for</label>
        <select id="share-kind" disabled>
          <option value="reply">Replies</option>
          <option value="prompt">My prompts</option>
          <option value="conversation">Selected messages</option>
          <option value="comparison">Compare</option>
          <optgroup label="Cross-review">
            <option value="reviewCommon">All review modes</option>
            <option value="critique">Critique</option>
            <option value="errors">Find errors</option>
            <option value="improvements">Suggest improvements</option>
          </optgroup>
        </select>
      </div>
      <div class="field">
        <div class="field-head"><label id="message-label" for="share-message" class="title">Message with the shared reply</label><span id="count" class="detail" aria-live="off"></span></div>
        <textarea id="share-message" rows="6" maxlength="4000" spellcheck="true" disabled></textarea>
        <div class="field-foot">
          <span id="template-hint" class="detail">Insert</span>
          <button type="button" id="assistant-placeholder" class="tag" data-insert="{assistant}" title="The assistant’s name, such as ChatGPT" disabled>{assistant}</button>
          <button type="button" id="content-placeholder" class="tag" data-insert="{reply}" title="The shared text. Without it, the text goes at the end" disabled>{reply}</button>
          <button type="button" id="reset-message" class="text-button" disabled>Reset</button>
        </div>
      </div>
    </form>
    <p id="saved" class="saved" role="status" aria-live="polite"></p>
  </section>

  <footer><b>Send both</b> sits beside each chat’s Send button. <b>Share with…</b> sits beside Copy. Use <b>Select messages…</b> in the composer’s arrow menu to share several messages together.</footer>
  <script type="module" src="popup.js"></script>
  <script type="module" src="popup-reading.js"></script>
</body>
</html>
